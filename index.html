'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORAGE='menage.supabase.v1', views=[['tasks','Tâches','☷'],['members','Membres','♙'],['evaluate','Évaluer','◉'],['report','Compte rendu','▤'],['settings','Réglages','⚙']];
let config=loadConfig(), tasks=[],members=[],ratings=[],tab='tasks',selectedMember='',qrLink='',toastTimer;
function base64urlEncode(s){const bytes=new TextEncoder().encode(s);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function base64urlDecode(s){s=s.replace(/-/g,'+').replace(/_/g,'/');s+='='.repeat((4-s.length%4)%4);const bin=atob(s);return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}
function loadConfig(){try{return JSON.parse(localStorage.getItem(STORAGE)||'{}')}catch{return {}}}
function saveConfig(){config={url:$('#sb-url').value.trim().replace(/\/$/,''),key:$('#sb-key').value.trim(),base:$('#base-url').value.trim()};localStorage.setItem(STORAGE,JSON.stringify(config));toast('Réglages enregistrés');updateStatus()}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
function updateStatus(ok=null){const el=$('#status');el.className='status '+(ok===true?'ok':ok===false?'bad':'');el.textContent=ok===true?'Connecté':ok===false?'À vérifier':config.url&&config.key?'Configuré':'Hors ligne'}
function configured(){if(!config.url||!config.key){toast('Configurez d’abord Supabase dans Réglages.');return false}return true}
async function api(table,{method='GET',query='',body=null,prefer=''}={}){if(!configured())throw new Error('Configurez Supabase dans Réglages.');let url=config.url+'/rest/v1/'+table+(query?'?'+query:'');let headers={apikey:config.key,Authorization:'Bearer '+config.key};if(body!==null){headers['Content-Type']='application/json';headers.Prefer=prefer||'return=representation'}else headers.Accept='application/json';if(prefer)headers.Prefer=prefer;let res;try{res=await fetch(url,{method,headers,body:body===null?undefined:JSON.stringify(body)})}catch(e){throw new Error('Connexion impossible. Vérifiez votre accès Internet et l’adresse Supabase.')}let text=await res.text();if(!res.ok){let msg;try{msg=JSON.parse(text).message||JSON.parse(text).hint}catch{}throw new Error(msg||`Erreur Supabase (${res.status}). Vérifiez les réglages et les politiques RLS.`)}return text?JSON.parse(text):[]}
async function refresh(){if(!config.url||!config.key){tasks=[];members=[];ratings=[];render();return}try{[tasks,members,ratings]=await Promise.all([api('tasks',{query:'select=id,title&order=title.asc'}),api('members',{query:'select=id,name&order=name.asc'}),api('ratings',{query:'select=member_id,task_id,score'})]);updateStatus(true);if(!tasks.length){await api('tasks',{method:'POST',body:[{title:'Laver la vaisselle'},{title:'Sortir les poubelles'},{title:'Passer l’aspirateur'},{title:'Préparer les repas'},{title:'Nettoyer la salle de bain'}]});tasks=await api('tasks',{query:'select=id,title&order=title.asc'})}render()}catch(e){updateStatus(false);renderError(e.message)}}
function renderError(msg){const el=$('#app');el.innerHTML=`<p class="eyebrow">Petit souci de connexion</p><h1>On n’arrive pas à synchroniser.</h1><div class="panel"><p>${esc(msg)}</p><button class="btn" id="retry">Réessayer</button></div>`;$('#retry').onclick=()=>refresh()}

function renderNav(){$('#nav').innerHTML=views.map(([id,name,icon])=>`<button class="${id===tab?'active':''}" data-tab="${id}" aria-label="${name}"><span class="ico">${icon}</span>${name}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=async()=>{tab=b.dataset.tab;await refresh();render()})}
function titleBlock(kicker,title,desc){return `<p class="eyebrow">${kicker}</p><h1>${title}</h1><p class="intro">${desc}</p>`}
function render(){renderNav();const app=$('#app');if(tab==='tasks')app.innerHTML=titleBlock('Le quotidien, en clair','Les tâches','Qu’est-ce qui demande de l’attention à la maison ?')+`<div class="panel"><form id="add-task" class="row"><input class="field" name="title" maxlength="100" placeholder="Ajouter une tâche…" aria-label="Nom de la tâche" required><button class="btn" aria-label="Ajouter">＋</button></form><ul class="list">${tasks.length?tasks.map(t=>`<li><span class="name">${esc(t.title)}</span><button class="trash" data-delete-task="${esc(t.id)}" aria-label="Supprimer ${esc(t.title)}">×</button></li>`).join(''):'<li class="empty">Aucune tâche pour le moment.</li>'}</ul></div>`;
else if(tab==='members')app.innerHTML=titleBlock('Les personnes','Les membres','Chacun·e évalue les tâches à sa façon. Ajoutez les personnes du foyer.')+`<div class="panel"><form id="add-member" class="row"><input class="field" name="name" maxlength="80" placeholder="Prénom ou nom…" aria-label="Nom du membre" required><button class="btn" aria-label="Ajouter">＋</button></form><ul class="list">${members.length?members.map(m=>`<li><span class="name">${esc(m.name)}</span><button class="trash" data-delete-member="${esc(m.id)}" aria-label="Supprimer ${esc(m.name)}">×</button></li>`).join(''):'<li class="empty">Ajoutez un premier membre pour commencer.</li>'}</ul></div>`;
else if(tab==='evaluate')renderEvaluate(app);else if(tab==='report')renderReport(app);else renderSettings(app);bindActions()}
function renderEvaluate(app){if(!members.length||!tasks.length){app.innerHTML=titleBlock('Le tour de chacun','Évaluer','Indiquez ce qui compte le plus au quotidien.')+`<div class="panel empty">${!members.length?'Ajoutez des membres dans l’onglet Membres.':'Ajoutez des tâches dans l’onglet Tâches.'}</div>`;return}let pending=members.filter(m=>!tasks.every(t=>ratings.some(r=>r.member_id===m.id&&r.task_id===t.id)));if(!selectedMember||!members.some(m=>m.id===selectedMember))selectedMember=(pending[0]||members[0]).id;let m=members.find(x=>x.id===selectedMember),done=tasks.filter(t=>ratings.some(r=>r.member_id===m.id&&r.task_id===t.id)).length;app.innerHTML=titleBlock('Votre regard compte','Évaluer les tâches','0 = pas prioritaire · 10 = très prioritaire')+`<div class="panel"><label for="member-choice">Qui évalue ?</label><select id="member-choice" class="select">${members.map(x=>`<option value="${esc(x.id)}" ${m.id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><div class="progress"><i style="width:${Math.round(done/tasks.length*100)}%"></i></div><p class="hint">${done} sur ${tasks.length} tâche${tasks.length>1?'s':''} déjà évaluée${tasks.length>1?'s':''}</p><form id="rating-form">${tasks.map(t=>{let r=ratings.find(x=>x.member_id===m.id&&x.task_id===t.id);return `<div class="task-rate"><div class="task-head"><span>${esc(t.title)}</span><output class="score" for="s-${esc(t.id)}">${r?r.score:5}</output></div><input id="s-${esc(t.id)}" type="range" min="0" max="10" step="1" value="${r?r.score:5}" name="${esc(t.id)}" aria-label="Priorité de ${esc(t.title)}"></div>`}).join('')}<button class="btn" type="submit" style="width:100%;margin-top:17px">Enregistrer mes priorités</button></form></div>`;$('#member-choice').onchange=e=>{selectedMember=e.target.value;render()};app.querySelectorAll('input[type=range]').forEach(i=>i.oninput=()=>i.parentElement.querySelector('output').textContent=i.value);$('#rating-form').onsubmit=async e=>{e.preventDefault();const rows=[...e.currentTarget.querySelectorAll('input[type=range]')].map(i=>({member_id:m.id,task_id:i.name,score:Number(i.value)}));try{await api('ratings',{method:'POST',query:'on_conflict=member_id,task_id',body:rows,prefer:'resolution=merge-duplicates,return=minimal'});[tasks,members,ratings]=await Promise.all([api('tasks',{query:'select=id,title&order=title.asc'}),api('members',{query:'select=id,name&order=name.asc'}),api('ratings',{query:'select=member_id,task_id,score'})]);let next=members.find(x=>x.id!==m.id&&!tasks.every(t=>ratings.some(r=>r.member_id===x.id&&r.task_id===t.id)));if(next)selectedMember=next.id;else selectedMember=m.id;toast(next?`Merci ! Au tour de ${next.name}.`:'Merci, vos priorités sont enregistrées.');render()}catch(err){toast(err.message)}}}
function renderReport(app){let means=tasks.map(t=>{let vals=ratings.filter(r=>r.task_id===t.id);return{task:t.title,id:t.id,count:vals.length,avg:vals.length?vals.reduce((s,r)=>s+Number(r.score),0)/vals.length:null}}).sort((a,b)=>(b.avg??-1)-(a.avg??-1));let count=members.filter(m=>tasks.length&&tasks.every(t=>ratings.some(r=>r.member_id===m.id&&r.task_id===t.id))).length;app.innerHTML=titleBlock('La vue d’ensemble','Compte rendu','Les priorités du foyer, rassemblées en un coup d’œil.')+`<div class="panel"><div class="summary-head"><div><h2 class="section-title">Les priorités</h2><div class="hint">${count} / ${members.length} membres ont tout évalué</div></div><button class="btn secondary small" id="copy-summary">Copier</button></div>${means.length?'<div class="rank">'+means.map((x,i)=>`<div class="rank-item"><div class="rank-label"><span>${esc(x.task)}</span><span>${x.avg===null?'—':x.avg.toFixed(1)+' / 10'}</span></div><div class="bar-bg"><div class="bar ${i===0?'bar-top':''}" style="width:${x.avg===null?0:x.avg*10}%"></div></div><div class="hint">${x.count} évaluation${x.count>1?'s':''}</div></div>`).join(''):'<p class="empty">Aucune tâche à présenter.</p>'}</div><div class="panel"><h2 class="section-title">Détail par personne</h2><div class="table-wrap"><table><thead><tr><th>Membre</th>${tasks.map(t=>`<th>${esc(t.title)}</th>`).join('')}</tr></thead><tbody>${members.map(m=>`<tr><td>${esc(m.name)}</td>${tasks.map(t=>{let r=ratings.find(x=>x.member_id===m.id&&x.task_id===t.id);return `<td>${r?esc(r.score):'—'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></div><button class="btn danger" id="reset-ratings" style="width:100%">Effacer toutes les évaluations</button>`;$('#copy-summary').onclick=async()=>{let text='Priorité du ménage\n'+means.map((x,i)=>`${i+1}. ${x.task} : ${x.avg===null?'pas encore évalué':x.avg.toFixed(1)+'/10'}`).join('\n');try{await navigator.clipboard.writeText(text);toast('Résumé copié.')}catch{toast('Copie impossible sur cet appareil.')}};$('#reset-ratings').onclick=async()=>{if(confirm('Effacer toutes les évaluations ? Cette action est définitive.'))await act(()=>api('ratings',{method:'DELETE',query:'member_id=not.is.null'}))}}
function defaultBase(){return location.protocol==='file:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'?'':location.origin+location.pathname}
function makeLink(){let base=$('#base-url').value.trim();if(!base){toast('Saisissez l’adresse web de l’application pour créer le QR.');return}let payload=base64urlEncode(JSON.stringify({url:$('#sb-url').value.trim().replace(/\/$/,''),key:$('#sb-key').value.trim()}));qrLink=base.split('#')[0]+'#sb='+payload;$('#copy-link').disabled=false;let qr=qrcode(15,'L');qr.addData(qrLink);qr.make();$('#qrbox').innerHTML=qr.createSvgTag(5,4);let svg=$('#qrbox svg');if(svg){svg.setAttribute('role','img');svg.setAttribute('aria-label','QR code de configuration')} }
function renderSettings(app){let protocol=location.protocol,local=protocol==='file:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';app.innerHTML=titleBlock('La connexion','Réglages','Reliez l’application à votre espace Supabase.')+`<div class="panel"><label for="sb-url">Project URL</label><input class="field" id="sb-url" type="url" placeholder="https://votre-projet.supabase.co" value="${esc(config.url||'')}"><label for="sb-key">Clé anon / publishable</label><input class="field" id="sb-key" type="password" autocomplete="off" placeholder="Votre clé anon Supabase" value="${esc(config.key||'')}"><div class="row" style="margin-top:16px"><button class="btn" id="save-settings">Enregistrer</button><button class="btn secondary" id="test-connection">Tester la connexion</button></div></div><div class="panel"><h2 class="section-title">Partager la connexion</h2><p class="hint">Scannez ce QR sur un autre appareil pour configurer Priorité du ménage en une étape.</p><label for="base-url">Adresse de l’application</label><input class="field" id="base-url" type="url" placeholder="https://votre-site.netlify.app/" value="${esc(config.base||defaultBase())}" ${local?'':'readonly'}>${local?'<p class="hint">En local, indiquez ici l’adresse publique de votre application hébergée.</p>':''}<div class="qrbox" id="qrbox"><span class="hint">Enregistrez l’URL et la clé, puis créez le QR.</span></div><div class="warning">Le QR contient la clé anon. Cette clé est conçue pour un usage public uniquement avec des politiques RLS correctement configurées ; ne partagez pas le QR publiquement et ne mettez jamais une clé secrète/service_role ici.</div><div class="row" style="margin-top:14px"><button class="btn secondary" id="make-qr">Créer / actualiser le QR</button><button class="btn secondary" id="copy-link" disabled>Copier le lien</button></div></div>`;$('#save-settings').onclick=()=>{saveConfig();refresh()};$('#test-connection').onclick=async()=>{config={url:$('#sb-url').value.trim().replace(/\/$/,''),key:$('#sb-key').value.trim()};try{await api('tasks',{query:'select=id&limit=1'});updateStatus(true);toast('Connexion Supabase réussie.')}catch(e){updateStatus(false);toast(e.message)}};$('#make-qr').onclick=()=>{saveConfig();makeLink()};$('#copy-link').onclick=async()=>{if(!qrLink)return;try{await navigator.clipboard.writeText(qrLink);toast('Lien copié.')}catch{toast('Copie impossible sur cet appareil.')}};if(config.url&&config.key)makeLink()}
function bindActions(){const addTask=$('#add-task');if(addTask)addTask.onsubmit=async e=>{e.preventDefault();let title=new FormData(e.currentTarget).get('title').trim();if(title)await act(()=>api('tasks',{method:'POST',body:{title}}))};const addMember=$('#add-member');if(addMember)addMember.onsubmit=async e=>{e.preventDefault();let name=new FormData(e.currentTarget).get('name').trim();if(name)await act(()=>api('members',{method:'POST',body:{name}}))};document.querySelectorAll('[data-delete-task]').forEach(b=>b.onclick=()=>confirm('Supprimer cette tâche et ses évaluations ?')&&act(()=>api('tasks',{method:'DELETE',query:'id=eq.'+encodeURIComponent(b.dataset.deleteTask)})));document.querySelectorAll('[data-delete-member]').forEach(b=>b.onclick=()=>confirm('Supprimer ce membre et ses évaluations ?')&&act(()=>api('members',{method:'DELETE',query:'id=eq.'+encodeURIComponent(b.dataset.deleteMember)})))}
function onHash(){let m=location.hash.match(/^#sb=(.+)$/);if(!m)return false;try{let value=JSON.parse(base64urlDecode(m[1]));if(!value.url||!value.key)throw 0;config={...config,url:value.url,key:value.key};localStorage.setItem(STORAGE,JSON.stringify(config));history.replaceState(null,'',location.pathname+location.search);toast('Connexion configurée');updateStatus();refresh();return true}catch{history.replaceState(null,'',location.pathname+location.search);toast('Le lien de configuration est invalide.');return false}}
window.__menageTest={base64urlEncode,base64urlDecode};
render();if(!onHash())refresh();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
