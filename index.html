function defaultBase(){return location.protocol==='file:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'?'':location.origin+location.pathname}
function makeLink(){let base=$('#base-url').value.trim();if(!base){toast('Saisissez l’adresse web de l’application pour créer le QR.');return}let payload=base64urlEncode(JSON.stringify({url:$('#sb-url').value.trim().replace(/\/$/,''),key:$('#sb-key').value.trim()}));qrLink=base.split('#')[0]+'#sb='+payload;$('#copy-link').disabled=false;let qr=qrcode(15,'L');qr.addData(qrLink);qr.make();$('#qrbox').innerHTML=qr.createSvgTag(5,4);let svg=$('#qrbox svg');if(svg){svg.setAttribute('role','img');svg.setAttribute('aria-label','QR code de configuration')}}
function renderSettings(app){let local=location.protocol==='file:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';app.innerHTML=titleBlock('La connexion','Réglages','Reliez l’application à votre espace Supabase.')+`<div class="panel"><h2 class="section-title">Profil sur cet appareil</h2><p class="hint">Le profil choisi est mémorisé uniquement sur cet appareil.</p><button class="btn secondary" id="change-person-settings">Sélectionner le membre</button></div><div class="panel"><label for="sb-url">Project URL</label><input class="field" id="sb-url" type="url" placeholder="https://votre-projet.supabase.co" value="${esc(config.url||'')}"><label for="sb-key">Clé anon / publishable</label><input class="field" id="sb-key" type="password" autocomplete="off" placeholder="Votre clé anon Supabase" value="${esc(config.key||'')}"><div class="row" style="margin-top:16px"><button class="btn" id="save-settings">Enregistrer</button><button class="btn secondary" id="test-connection">Tester la connexion</button></div></div><div class="panel"><h2 class="section-title">Partager la connexion</h2><p class="hint">Scannez ce QR sur un autre appareil pour configurer Priorité du ménage en une étape.</p><label for="base-url">Adresse de l’application</label><input class="field" id="base-url" type="url" placeholder="https://votre-site.netlify.app/" value="${esc(config.base||defaultBase())}" ${local?'':'readonly'}>${local?'<p class="hint">En local, indiquez ici l’adresse publique de votre application hébergée.</p>':''}<div class="qrbox" id="qrbox"><span class="hint">Enregistrez l’URL et la clé, puis créez le QR.</span></div><div class="warning">Le QR contient la clé anon. Cette clé est conçue pour un usage public uniquement avec des politiques RLS correctement configurées ; ne partagez pas le QR publiquement et ne mettez jamais une clé secrète/service_role ici.</div><div class="row" style="margin-top:14px"><button class="btn secondary" id="make-qr">Créer / actualiser le QR</button><button class="btn secondary" id="copy-link" disabled>Copier le lien</button></div></div>`;$('#change-person-settings').onclick=()=>{selectedMember='';localStorage.removeItem(CURRENTKEY);localStorage.removeItem(ADMINKEY);renderWho($('#app'))};$('#save-settings').onclick=()=>{saveConfig();refresh()};$('#test-connection').onclick=async()=>{config={url:$('#sb-url').value.trim().replace(/\/$/,''),key:$('#sb-key').value.trim()};try{await api('tasks',{query:'select=id&limit=1'});updateStatus(true);toast('Connexion Supabase réussie.')}catch(e){updateStatus(false);toast(e.message)}};$('#make-qr').onclick=()=>{saveConfig();makeLink()};$('#copy-link').onclick=async()=>{if(!qrLink)return;try{await navigator.clipboard.writeText(qrLink);toast('Lien copié.')}catch{toast('Copie impossible sur cet appareil.')}};if(config.url&&config.key)makeLink()}
function onHash(){let m=location.hash.match(/^#sb=(.+)$/);if(!m)return false;try{let value=JSON.parse(base64urlDecode(m[1]));if(!value.url||!value.key)throw 0;config={...config,url:value.url,key:value.key};localStorage.setItem(STORAGE,JSON.stringify(config));history.replaceState(null,'',location.pathname+location.search);toast('Connexion configurée');updateStatus();refresh();return true}catch{history.replaceState(null,'',location.pathname+location.search);toast('Le lien de configuration est invalide.');return false}}
window.__menageTest={planningView,setPlanningTestData:(m,t,r,a)=>{members=m;tasks=t;ratings=r;availability=a},base64urlEncode,base64urlDecode,generatePlan,weeklyMinutes,isoInfo,normalizeAvailability,loadAvailability,renderWho,renderFirstMember,taskEditor,taskFormHandlers,renderSettings,normalizedTask,audienceLabel,importLocalCache,setAvailabilityForTest:(id,value)=>{availability[String(id)]=value}};function showStartupError(error){const app=$('#app');if(app)app.innerHTML=`<p class="eyebrow">Petit souci au démarrage</p><h1>L’application n’a pas pu s’ouvrir.</h1><div class="panel" role="alert"><p>${esc(error?.message||error||'Erreur inconnue.')}</p><p class="hint">Rechargez la page. Si le problème persiste, vérifiez la version déployée et les réglages du navigateur.</p></div>`;console.error('Erreur au démarrage de Priorité du ménage',error)}try{render();if(!onHash())void refresh().catch(error=>{console.error('Erreur non gérée de synchronisation',error);renderError(error.message||error)});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(error=>console.warn('Service worker indisponible',error)))}catch(error){showStartupError(error)}
</script></body></html>
